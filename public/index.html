<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>골든타임 세이프맵 | 긴급 안전시설 탐색 & 도보 길안내</title>
  
  <!-- Pretendard 공식 경량 CDN (Google Fonts 에러 및 ORB 차단 완전 방지) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 카카오맵 SDK 태블릿/모바일(갤럭시탭, 아이패드) 터치 제스처 활성화 패치 -->
  <script>
    (function() {
      try {
        var isTouchDevice = ('ontouchstart' in window) ||
          (navigator.maxTouchPoints > 0) ||
          (navigator.msMaxTouchPoints > 0);

        if (isTouchDevice) {
          if (!('ontouchstart' in document.documentElement)) {
            document.documentElement.ontouchstart = null;
          }
          var ua = navigator.userAgent || '';
          if (ua.indexOf('Android') === -1 && ua.indexOf('iPhone') === -1 && ua.indexOf('iPad') === -1) {
            var patchedUa = ua + ' Android';
            try {
              Object.defineProperty(navigator, 'userAgent', {
                get: function() { return patchedUa; },
                configurable: true
              });
            } catch (e) {}
          }
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-0rPlBKJs.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BPDCnEmx.css">
</head>

</body>
