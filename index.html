<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="세이프맵" />
  <meta name="application-name" content="세이프맵" />
  <meta name="description" content="가장 가까운 AED와 민방위 대피소를 찾아 걸어가는 길을 안내해요." />

  <!-- 🌟 PWA Web App Manifest & 홈화면 앱 아이콘 -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>세이프맵 · 가장 가까운 AED 찾기</title>
  
  <!-- Pretendard 공식 경량 CDN (Google Fonts 에러 및 ORB 차단 완전 방지) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 카카오맵 SDK 태블릿/모바일(갤럭시탭, 아이패드) 터치 제스처 활성화 패치 -->
  <script>
    (function() {
      try {
        var isTouchDevice = ('ontouchstart' in window) ||
          (navigator.maxTouchPoints > 0) ||
          (navigator.msMaxTouchPoints > 0);

        if (isTouchDevice) {
          if (!('ontouchstart' in document.documentElement)) {
            document.documentElement.ontouchstart = null;
          }
          var ua = navigator.userAgent || '';
          if (ua.indexOf('Android') === -1 && ua.indexOf('iPhone') === -1 && ua.indexOf('iPad') === -1) {
            var patchedUa = ua + ' Android';
            try {
              Object.defineProperty(navigator, 'userAgent', {
                get: function() { return patchedUa; },
                configurable: true
              });
            } catch (e) {}
          }
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
